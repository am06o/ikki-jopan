<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이끼네 조판기</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net data: blob:; img-src 'self' blob: data:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/css/all.css" integrity="sha384-7bLTAEOU63sqkP/DytZqV+GtomgqCN5FTaQxLNvmBivLqWZWMOD329UogwV0t+aI" crossorigin="anonymous">
<style>
:root{--acc:#1F5C3F;--acc-h:#17472F;--acc-t:#E6F0EA;--ink:#18181B;--mute:#52525B;--soft:#71717A;--line:#E4E4E7;--panel:#FAFAFA;--desk:#E9E9EC}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:14px/1.5 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ib{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:0;background:transparent;border-radius:7px;cursor:pointer;color:#3F3F46;flex:none;padding:0}
.ib:hover{background:#EDEDEF}
.ib.on{background:var(--acc-t);color:var(--acc)}
.ib.sm{width:26px;height:30px}.ib.sm svg.i{width:14px;height:14px}
.num{width:42px;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;padding:0 4px}
.num:hover{border-color:var(--line)}.num:focus{border-color:var(--acc);outline:0;background:#fff}
.dd{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;width:100%;text-align:left}
.dd span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column}
header.top{transition:margin-top .2s ease;height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
body.hidehdr header.top{margin-top:-53px}
@media (prefers-reduced-motion:reduce){header.top{transition:none}}
#docTitle{field-sizing:content;min-width:80px;max-width:440px;height:34px;border:0;background:transparent;font-weight:500;font-size:15px;padding:0 8px;border-radius:8px}
#docTitle:hover{background:#F4F4F5}
#saved{display:inline-flex;align-items:center;gap:4px;color:var(--soft);font-size:13px;white-space:nowrap}
#saved svg.i{width:15px;height:15px}
#exportBtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:34px;border-radius:8px;background:var(--acc);color:#fff;border:0;cursor:pointer;margin-left:6px}
#exportBtn:hover{background:var(--acc-h)}
.vt{display:none;background:#F4F4F5;border-radius:10px;padding:3px;gap:2px}
.vt button{width:38px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.vt button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.body{flex:1;min-height:0;display:flex;position:relative}
aside#panel{flex:0 0 236px;display:flex;flex-direction:column;padding:2px 14px 10px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
.grp{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center}
.step{display:flex;align-items:center;height:36px}
.unit{font-size:12px;color:var(--soft);width:26px;padding-left:3px}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;padding:0;border:1px solid #D4D4D8}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--acc)}
.swc{width:28px;height:28px;border-radius:50%;padding:2px;border:0;cursor:pointer;background:conic-gradient(#E5484D,#F5A524,#46A758,#3E63DD,#8E4EC6,#E5484D)}
.swc span{display:block;width:24px;height:24px;border-radius:50%;border:2px solid #fff}
.swc.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--acc)}
.rbox{display:inline-block;width:9px;border:1.75px solid currentColor;border-radius:2px}
.pnbtn{display:flex;align-items:center;gap:8px;height:36px;border:0;border-radius:8px;padding:0 4px;cursor:pointer;background:transparent;width:100%}
.pnbtn:hover{background:#EDEDEF}.pnbtn.on{background:var(--acc-t);color:var(--acc)}
main#desk{flex:1;min-width:0;background:var(--desk);overflow:auto;position:relative}
#sizer{position:relative;margin:24px 28px}
body.vm #sizer{margin:24px auto}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
#pages{position:absolute;left:0;top:0}
.pg{position:absolute;top:0;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.spfill{position:absolute;top:0;pointer-events:none}.spine{position:absolute;top:0;width:16px;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.07) 50%,rgba(0,0,0,0))}
.pg.blank{opacity:.6}.colo{position:absolute;pointer-events:none;user-select:none;white-space:pre-wrap;overflow-wrap:anywhere}
.pn,.sg{position:absolute;line-height:1;white-space:nowrap;user-select:none;pointer-events:none}
#ed{position:absolute;outline:0;column-fill:auto;text-justify:inter-character;orphans:1;widows:1;overflow-wrap:anywhere;caret-color:var(--acc)}
#ed .p{margin:0;position:relative}
.vsheet{position:absolute;left:0;top:0;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.vbrk{position:absolute;left:0;right:0;border-top:1.5px dashed color-mix(in srgb,var(--acc) 45%,transparent);pointer-events:none}

.marks #ed .p.e::before{position:absolute;left:.45em;top:50%;transform:translateY(-50%);line-height:1}
.marks #ed .p:not(.e)::after,.marks #ed .p.e::before{content:'\21B5';display:inline-block;width:0;overflow:visible;white-space:nowrap;text-indent:2px;color:var(--acc);opacity:.55;font:400 .8em system-ui,sans-serif;font-style:normal;user-select:none;pointer-events:none}
body #ed.empty > .p:first-child::before{content:attr(data-ph)!important;display:inline!important;width:auto!important;text-indent:0!important;transform:none!important;top:auto!important;line-height:inherit!important;font:inherit!important;color:#A1A1AA!important;opacity:1!important;position:absolute;left:0;right:0;white-space:nowrap;pointer-events:none}
footer.bot{height:30px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 14px;font-size:12px;color:var(--mute)}
footer.bot .z{width:40px;text-align:center;font-variant-numeric:tabular-nums}
.pop{position:fixed;z-index:55;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;display:none}
.pop.open{display:block}
.menu{flex-direction:column;padding:6px;min-width:220px}.pop.menu.open{display:flex}
.mi{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 10px;border:0;border-radius:8px;cursor:pointer;text-align:left;background:transparent;width:100%}
.mi:hover{background:#F4F4F5}.mi.on{background:#F4F4F5}
.mi .k{font-size:11px;color:#A1A1AA}
.hr{height:1px;background:var(--line);margin:6px 4px}
.segx{display:flex;gap:2px;background:#F4F4F5;border-radius:8px;padding:2px}
.segx button{flex:1;height:30px;border:0;border-radius:6px;cursor:pointer;font-size:13px;background:transparent;color:var(--mute);padding:0 10px;white-space:nowrap}
.segx button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:#fff}
.posbox{position:relative;width:62px;height:124px;flex:none;border:1.5px solid #A1A1AA;border-radius:5px;background:#fff;align-self:center}
.posbox i{position:absolute;left:14px;right:14px;height:2px;background:var(--line)}
.dot{position:absolute;width:22px;height:22px;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot span{width:8px;height:8px;border-radius:50%;border:1.5px solid #A1A1AA;background:#fff}
.dot.on span{background:var(--acc);border-color:var(--acc)}
#bubble{position:fixed;z-index:25;display:none;gap:2px;padding:4px;background:#18181B;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
#bubble.open{display:flex}
#bubble button{height:30px;padding:0 10px;border:0;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;background:transparent;color:#E4E4E7}
#bubble button.on{background:var(--acc);color:#fff}
#drawer{position:absolute;right:0;top:0;bottom:0;width:400px;max-width:100%;background:#fff;border-left:1px solid var(--line);z-index:20;display:none;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
#drawer.open{display:flex}
.dh{height:52px;display:flex;align-items:center;gap:8px;padding:0 10px 0 18px;border-bottom:1px solid var(--line);flex:none;font-weight:600;font-size:15px}
.dbody{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:22px}.dbody[hidden]{display:none}
.sec{display:flex;flex-direction:column;gap:6px}
.sech{display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.srow{border-radius:10px}.srow.open{background:#F7F7F8}
.shead{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 10px;border:0;background:transparent;cursor:pointer;text-align:left}
.shead .nm{flex:1;color:var(--ink)}
.sbody{display:none;flex-direction:column;gap:8px;padding:2px 10px 12px}
.srow.open .sbody{display:flex}
.lab{font-size:12px;color:var(--soft);width:44px;flex:none}
dialog{border:0;padding:0;background:transparent;max-width:calc(100vw - 24px)}
dialog::backdrop{background:rgba(10,12,18,.45)}
.dlg{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:18px;display:flex;flex-direction:column;gap:16px;width:324px;max-width:100%}
.tiles{display:flex;gap:8px}
.tile{flex:1;height:64px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:#3F3F46}
.tile svg.i{width:22px;height:22px}
.tile.on{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}

.info{display:flex;gap:16px;font-size:13px;color:var(--mute)}
.info span{display:inline-flex;align-items:center;gap:6px}
.info svg.i{width:16px;height:16px}
.pri{flex:1;height:44px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pri:disabled{opacity:.6;cursor:default}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#18181B;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;z-index:70;display:none;align-items:center;gap:12px}
#toast.open{display:flex}
#toast button{border:0;background:transparent;color:#9FE0BC;cursor:pointer;font-weight:600}
#preview{position:absolute;inset:0;background:var(--desk);z-index:15;display:none;flex-direction:column}
#preview.open{display:flex}
.pvbar{display:flex;align-items:center;gap:8px;padding:14px 16px 0;flex:none}
.pvseg{display:inline-flex;gap:2px;background:#fff;border-radius:10px;padding:3px}
.pvseg button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;font-size:13px;border:0;background:transparent;color:var(--mute);cursor:pointer}
.pvseg button.on{background:var(--acc);color:#fff}
.pvseg .rbox{width:8px;border-width:1.5px}
#pv100{height:40px;padding:0 12px;border-radius:10px;font-size:13px;cursor:pointer;background:#fff;color:#3F3F46;border:1px solid var(--line);font-variant-numeric:tabular-nums}
#pvStrip{flex:1;min-height:0;display:flex;align-items:center;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 32px 28px}
#pvStrip canvas{width:auto;height:auto;max-height:100%;max-width:calc(100vw - 64px);flex:none;scroll-snap-align:center;box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:4px;background:#fff}
#lb{position:fixed;inset:0;z-index:60;background:#000;display:none}
#lbNav{display:none}
#lb.open{display:block}
#lbStrip{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory}
#lbStrip div{flex:none;width:100vw;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
#lbStrip canvas{max-width:100%;max-height:100%;display:block}
.lbtop{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 8px 0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
.lbtop button{width:44px;height:44px;border:0;border-radius:22px;background:rgba(0,0,0,.45);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.lbtop span{color:#fff;font-size:14px;font-variant-numeric:tabular-nums;padding:0 12px}
@media (min-width:761px){
  #lb{background:rgba(0,0,0,.95)}
  #lbStrip{overflow:hidden}
  #lbStrip div{padding:72px 0 100px;box-sizing:border-box;flex-direction:column;justify-content:flex-start;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
  #lbStrip canvas{width:390px;max-width:none;max-height:none;height:auto;margin:auto;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .lbtop{left:auto;right:20px;top:16px;height:auto;padding:0;background:none}
  .lbtop span{display:none}
  .lbtop button{background:#fff;color:#18181B;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .lbtop button:hover{background:#F4F4F5}
  #lbNav{display:flex;position:absolute;left:50%;bottom:28px;transform:translateX(-50%);align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:24px;padding:4px}
  #lbNav button{width:40px;height:40px;border:0;border-radius:20px;background:transparent;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  #lbNav button:hover:not(:disabled){background:rgba(255,255,255,.16)}
  #lbNav button:disabled{opacity:.3;cursor:default}
  #lbNum{color:#fff;font-size:14px;font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
}
#mbar{display:none}.monly{display:none!important}
#bxMap{display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow:auto;padding:2px 0}
.mg{display:flex;flex-direction:column;gap:3px}.mr{display:flex}
.mc{width:19px;height:25px;border:1px solid #D4D4D8;background:#fff;font-size:10px;line-height:1;color:var(--mute);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font-variant-numeric:tabular-nums}
.mr .mc+.mc{border-left:1px dashed #E4E4E7}.mc.b{border-style:dashed;background:transparent}.mc.c{color:var(--acc);border-color:var(--acc)}
#tip{position:fixed;z-index:90;display:none;background:#fff;color:#3F3F46;border:1px solid #D4D4D8;border-radius:4px;padding:3px 8px;font-size:12px;line-height:1.4;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12);pointer-events:none}#tip.open{display:block}
body:not(.book) .bonly{display:none!important}
body.book .tonly{display:none!important}
.swt{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:#D4D4D8;position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.swt::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.swt:checked{background:var(--acc)}.swt:checked::after{transform:translateX(14px)}
.bm{display:flex;align-items:center;height:32px}
.bm .lab{width:26px;font-size:12px;color:var(--soft)}
.bm .num{width:30px;text-align:center;padding:0 2px}
.bm .ib.sm{width:22px}
.over{color:#B42318}
#bookInfo{display:inline-flex;align-items:center;gap:4px}#bookInfo svg.i{width:14px;height:14px;color:var(--acc)}
.vrow{display:flex;align-items:center;gap:6px;min-height:44px;width:100%;border:0;background:transparent;padding:0 2px;border-radius:8px;text-align:left;cursor:default}
button.vrow{cursor:pointer}button.vrow:hover{background:#F4F4F5}
.vrow .lbl,.step .lbl{color:var(--mute);width:28px;display:inline-flex;flex:none}
.vlab{font-size:13px;color:#3F3F46;white-space:nowrap}
.vval{flex:1;text-align:right;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.vchev{color:var(--soft);display:inline-flex;width:32px;justify-content:center;flex:none}
.vrow .ib.sm{width:32px}.vchev svg.i{width:14px;height:14px}
.mchip{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 6px 0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;flex:none;white-space:nowrap}
#fileIn{display:none}
@media (max-width:760px){
  header.top{padding:0 6px 0 10px;gap:4px}
  #docTitle{flex:1;max-width:none;field-sizing:fixed;text-overflow:ellipsis}
  #saved,.hdesk{display:none}
  .vt{display:inline-flex}
  #exportBtn{background:transparent;color:var(--acc);width:44px;height:44px;margin:0}
  aside#panel,footer.bot,#bubble{display:none!important}
  #mbar{display:flex;flex:none;height:50px;border-bottom:1px solid var(--line);align-items:center;gap:2px;padding:0 6px;overflow-x:auto;scrollbar-width:none}
  #mbar .ib{width:40px;height:40px}
  #mbar .ib.on{background:var(--acc-t);color:var(--acc)}
  .viewing #mbar{display:none}
  .monly{display:flex!important}
  .pop .ib{width:40px;height:40px}.vrow .ib.sm{width:32px;height:40px}
  #sizer{margin:14px 12px}
  body.vm #sizer{margin:14px auto}
  #drawer{position:fixed;inset:0;width:100%;z-index:45}
  .pop{max-width:calc(100vw - 16px)}
  .pop.menu{min-width:200px}
}

</style>
</head>
<body>
<div id="app">
<header class="top">
  <svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;color:var(--acc)" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M10 7h4M10 11h4M10 15h2"/></svg>
  <input id="docTitle" aria-label="원고 이름" value="새 원고" spellcheck="false">
  <span id="saved" aria-live="polite"></span>
  <div style="flex:1" class="hdesk"></div>
  <div class="vt" role="group" aria-label="보기">
    <button id="vEdit" class="on" aria-label="편집" title="편집" data-i="pen"></button>
    <button id="vView" aria-label="미리보기" title="미리보기" data-i="eye"></button>
  </div>
  <button class="ib hdesk" id="clearBtn" aria-label="모두 지우기" title="모두 지우기" data-i="trash"></button>
  <button class="ib hdesk" id="pvBtn" aria-label="미리보기" title="미리보기" data-i="eye"></button>
  <button class="ib hdesk" id="undoBtn" aria-label="실행 취소" title="실행 취소 (Ctrl+Z)" data-i="undo"></button>
  <button class="ib hdesk" id="redoBtn" aria-label="다시 실행" title="다시 실행 (Ctrl+Shift+Z)" data-i="redo"></button>
  <button id="exportBtn" aria-label="내보내기" title="내보내기" data-i="download"></button>
</header>
<nav id="mbar" aria-label="서식">
  <button class="mchip" id="mStyle" aria-label="양식" title="양식"><span id="mStyleName">본문</span><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="ib" id="mSize" aria-label="글자 크기" title="글자 크기" data-i="size"></button>
  <button class="ib" id="mSpace" aria-label="줄 간격과 문단 간격" title="줄 간격과 문단 간격" data-i="lh"></button>

  catch(err){toast(err&&err.message==='over'?'48쪽 초과':'저장 실패',err&&err.message==='over'?null:()=>$('#bxGo').click(),'재시도')}
  finally{go.disabled=false;gt.textContent='저장'}};

/* ---------- 마우스 올리면 이름 (PC) ---------- */
{const tip=$('#tip'),hover=matchMedia('(hover:hover) and (pointer:fine)');let tT=0,tEl=null;
  const hide=()=>{clearTimeout(tT);tip.classList.remove('open');tEl=null};
  document.addEventListener('mouseover',e=>{if(!hover.matches)return;const el=e.target.closest('[title],[data-tip]');if(el===tEl)return;hide();if(!el||el.closest('#lb'))return;
    if(el.hasAttribute('title')){el.dataset.tip=el.title;el.removeAttribute('title')}if(!el.dataset.tip)return;tEl=el;
    tT=setTimeout(()=>{if(tEl!==el||!el.isConnected)return;tip.textContent=el.dataset.tip;tip.classList.add('open');const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
      let x=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2)),y=r.bottom+6;if(y+h>innerHeight-6)y=r.top-h-6;tip.style.left=x+'px';tip.style.top=y+'px'},350)});
  document.addEventListener('mouseout',e=>{if(tEl&&!tEl.contains(e.relatedTarget))hide()});

/* ---------- 알림 ---------- */
let toastT;
function toast(t,act,label){$('#toastT').textContent=t;const b=$('#toastB');b.hidden=!act;if(act){b.textContent=label||'재시도';b.onclick=()=>{$('#toast').classList.remove('open');act()}}
  $('#toast').classList.add('open');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('open'),act?6000:2600)}

/* ---------- 모바일 ---------- */
function setView(v){document.body.classList.toggle('viewing',v==='view');$('#vEdit').classList.toggle('on',v==='edit');$('#vView').classList.toggle('on',v==='view');$('#preview').classList.toggle('open',v==='view');
  closePops();if(v==='view')renderPreview()}
$('#vEdit').onclick=()=>setView('edit');$('#vView').onclick=()=>setView('view');
let pvImgs=[];
let pvJob=0;
const pvWidth=()=>{const d=devicePixelRatio||1;return mobile.matches?Math.min(1080,Math.round(innerWidth*d)):Math.min(1440,Math.round(390*Math.max(2,d)))};
async function renderPreview(target){const job=++pvJob,w=pvWidth();pvImgs=[];const strip=$('#pvStrip');strip.innerHTML='';
  const emit=c=>{c.setAttribute('role','img');pvImgs.push(c);if(target==='lb')$('#lbStrip').append(wrapLB(c));else strip.append(c);lbCount()};
  // 카피본: 1쪽 혼자, 그다음 두 쪽씩 (펼침면)
  let held=null;const spread=(a,b)=>{const c=document.createElement('canvas');c.width=a.width+b.width;c.height=a.height;const x=c.getContext('2d');x.drawImage(a,0,0);x.drawImage(b,a.width,0);
    const gr=x.createLinearGradient(a.width-a.width*.04,0,a.width+a.width*.04,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,'rgba(0,0,0,.07)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(a.width*.96,0,a.width*.08,c.height);
    a.width=b.width=0;return c};
  await renderPages(w,[...Array(N).keys()],(c,i)=>{if(job!==pvJob)return;
    if(!isBook()){c.setAttribute('aria-label',(i+1)+'장');emit(c);return}
    if(i%2&&i<N-1){held=c;return}
    if(held){const sp=spread(held,c);sp.setAttribute('aria-label',i+', '+(i+1)+'쪽');sp.style.width='min(780px,calc(100vw - 80px))';held=null;emit(sp)}
    else{c.setAttribute('aria-label',(i+1)+'쪽');c.style.width='min(390px,calc(50vw - 40px))';emit(c)}});}
const cloneCanvas=c=>{const n=document.createElement('canvas');n.width=c.width;n.height=c.height;n.style.width=c.style.width;n.getContext('2d').drawImage(c,0,0);n.setAttribute('role','img');n.setAttribute('aria-label',c.getAttribute('aria-label'));return n};
const wrapLB=c=>{const d=document.createElement('div');d.append(c);return d};
$('#pv100').onclick=()=>openLB(0);
$('#pvStrip').addEventListener('click',e=>{const im=e.target.closest('canvas');if(im)openLB([...$('#pvStrip').children].indexOf(im))});
async function openLB(i,fresh){const s=$('#lbStrip');s.innerHTML='';$('#lb').classList.add('open');
  if(fresh||!pvImgs.length){await renderPreview('lb')}else{pvImgs.forEach(c=>s.append(wrapLB(cloneCanvas(c))))}
  s.scrollLeft=i*s.clientWidth;lbCount();history.pushState({lb:1},'');$('#lbX').focus({preventScroll:true})}
let lbI=0;
function lbCount(){if(!$('#lb').classList.contains('open'))return;const s=$('#lbStrip');lbI=Math.round(s.scrollLeft/Math.max(1,s.clientWidth));const t=(lbI+1)+' / '+pvImgs.length;$('#lbCount').textContent=t;$('#lbNum').textContent=t;$('#lbPrev').disabled=lbI<=0;$('#lbNext').disabled=lbI>=pvImgs.length-1}
function lbGo(i){const s=$('#lbStrip');i=Math.max(0,Math.min(pvImgs.length-1,i));s.scrollTo({left:i*s.clientWidth,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});lbI=i;setTimeout(lbCount,350)}
$('#lbPrev').onclick=()=>lbGo(lbI-1);$('#lbNext').onclick=()=>lbGo(lbI+1);
$('#lbStrip').addEventListener('click',e=>{if(!mobile.matches&&!e.target.closest('canvas'))$('#lbX').click()});
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('open'))return;if(e.key==='ArrowRight'){e.preventDefault();lbGo(lbI+1)}else if(e.key==='ArrowLeft'){e.preventDefault();lbGo(lbI-1)}});
const cdlg=$('#clearDlg');
const openClear=()=>{closePops();if(mobile.matches)ed.blur();$('#clearAll').checked=false;try{cdlg.showModal()}catch(e){cdlg.setAttribute('open','')}$('#clearNo').focus()};
$('#clearBtn').onclick=openClear;$('#mClear').onclick=openClear;
$('#clearNo').onclick=()=>cdlg.close();cdlg.addEventListener('click',e=>{if(e.target===cdlg)cdlg.close()});
$('#clearYes').onclick=()=>{const all=$('#clearAll').checked;cdlg.close();
  edit(()=>{ed.innerHTML=''});$('#docTitle').value='새 원고';
  if(all){const z=S.zoom;if(isBook())BKS=S=bookOf({zoom:z});else TWS=S={...DEF,pn:{...DEF.pn},sg:{...DEF.sg},zoom:z};STY=JSON.parse(JSON.stringify(DEFSTY));openRow=null;renderBubble();if($('#drawer').classList.contains('open'))renderStyles()}
  refresh();toast('모두 지움',()=>undo(),'되돌리기')};
$('#pvBtn').onclick=async()=>{const b=$('#pvBtn');b.disabled=true;try{await openLB(0,true)}finally{b.disabled=false}};
$('#lbStrip').addEventListener('scroll',lbCount,{passive:true});
function closeLB(){if($('#lb').classList.contains('open')){$('#lb').classList.remove('open')}}
$('#lbX').onclick=()=>{closeLB();if(history.state&&history.state.lb)history.back()};
addEventListener('popstate',()=>closeLB());
const mOpen=(id,btn)=>{if(mobile.matches){ed.blur();const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur()}openPop(id,btn)};
$('#mAdv').onclick=()=>{closePops();if(mobile.matches)ed.blur();openDrawer('view')};
$('#mStyle').addEventListener('mousedown',e=>e.preventDefault());
$('#mStyle').onclick=e=>{if(mobile.matches)ed.blur();styleMenu(e.currentTarget)};
$('#mSize').onclick=e=>mOpen('popSize',e.currentTarget);
$('#mSpace').onclick=e=>mOpen('popSpace',e.currentTarget);
$('#alignsM').innerHTML=AL.map(a=>'<button class="ib" data-al="'+a[0]+'" aria-label="'+a[1]+'" title="'+a[1]+'" style="width:44px;height:44px">'+svg(a[2])+'</button>').join('');
$('#alignsM').addEventListener('mousedown',e=>e.preventDefault());
$('#alignsM').addEventListener('click',e=>{const b=e.target.closest('button');if(b)applyAlign(b.dataset.al)});
$('#mAlign').onclick=e=>mOpen('popAlign',e.currentTarget);
$('#mMarks').addEventListener('mousedown',e=>e.preventDefault());
$('#mMarks').onclick=()=>{S.marks=!S.marks;refresh()};
function lockInputs(){const m=mobile.matches;$$('[data-sn],#lsNum,#pnSize,#sgSize').forEach(i=>{i.readOnly=m;i.setAttribute('inputmode',m?'none':'decimal');i.tabIndex=m?-1:0})}
function fitMobile(){if(mobile.matches){S.zoom=Math.max(30,Math.min(110,Math.floor((desk.clientWidth-24)/PW*100)));applyCSS();relayout();syncUI()}}
mobile.addEventListener('change',()=>{if(mobile.matches&&isBook()){setMode('tw');BOOKAUTO=true;save()}else if(!mobile.matches&&BOOKAUTO){BOOKAUTO=false;setMode('book')}setView('edit');closePops();lockInputs();fitMobile()});
addEventListener('resize',()=>{if(mobile.matches)fitMobile();else if(lmode()==='bwrap'&&ed.style.columnCount!==String(2*geo().k)){applyCSS();relayout()}});
let lastY=0,userScroll=0,hdrLock=0;
['wheel','touchmove'].forEach(t=>desk.addEventListener(t,()=>{userScroll=performance.now()},{passive:true}));
desk.addEventListener('keydown',e=>{if(['PageDown','PageUp','Home','End'].includes(e.key)&&e.target===desk)userScroll=performance.now()});
desk.addEventListener('scroll',()=>{const now=performance.now(),y=desk.scrollTop;
  if(now-userScroll>300||now<hdrLock){lastY=y;return}
  const d=y-lastY;if(Math.abs(d)<24)return;
  const hide=d>0&&y>60;if(hide!==document.body.classList.contains('hidehdr')){document.body.classList.toggle('hidehdr',hide);hdrLock=now+350}
  lastY=y},{passive:true});
ed.addEventListener('focus',()=>{hdrLock=performance.now()+400});
desk.addEventListener('mousedown',e=>{if(e.target===desk||e.target===sizer||e.target.classList.contains('pg')){e.preventDefault();ed.focus();const s=getSelection();const r=document.createRange();r.selectNodeContents(ed.lastElementChild);r.collapse(false);s.removeAllRanges();s.addRange(r)}});

(async()=>{
  for(const f of await dbAll()){try{await addFontBuf(f.name,f.buf)}catch(e){}}
  if(isBook()&&mobile.matches){MODE='tw';S=TWS;BOOKAUTO=true}syncMode();setScale();
  const first=!localStorage.getItem(KEY);ed.innerHTML=SAVEDHTML?sanitize(SAVEDHTML):'';normalize();renderBubble();lockInputs();applyCSS();if(first&&!mobile.matches)S.zoom=Math.max(30,Math.min(100,Math.floor((desk.clientHeight-48)/geo().PH*100)));if(isBook()&&!S.zoom){applyCSS();S.zoom=bookFit()}fitMobile();applyCSS();relayout();syncUI();commit();
  setSaved('ok');
  document.fonts.ready.then(()=>{relayout()});
  setTimeout(relayout,600);
})();
